# 役割定義。全体一覧の正本は docs/design/AI_ROLES.csv
# このファイルは複製せず更新する。変更は末尾の history に新しい順で追記する。
role_id: AI-03-05
role_name: レポート制作 AI
type: 係担当 AI
dept_code: D03
dept: AIV・調査分析部
section: レポート制作課
unit: レポート構成・執筆係
service_responsibility: null
max_risk_tier: low
human_checkpoint: 重要レポートは人間レビュー+経営管理部の独立監査
escalate_to: AI-D03
build_step: STEP4
pilot: true
impl_status: definition_drafted
definition:
  definition_status: draft（レビュー待ち。未承認）
  purpose: AIV 測定と AIO 診断の結果から、契約仕様に沿ったレポートを構成・執筆する。
  trigger:
  - AIO 診断の完了と引継ぎ
  inputs:
  - AIV 測定結果
  - AIO 診断結果
  - 契約仕様（案件）
  outputs:
  - レポート草稿（根拠資料・出典・実測／推計／不明の区別付き）
  - 品質・リスク監査 AI への監査依頼
  tools:
  - 共通DB（deliverables）
  - 文書生成（出力形式は要決定）
  permissions:
  - 'write: deliverables（レポート草稿）'
  - '禁止: 顧客への送信（人間承認後に別手順）'
  handoff_from:
  - AIO 診断 AI
  - 地域 AIV 分析 AI
  handoff_to:
  - 品質・リスク監査 AI
  human_checkpoints:
  - 重要成果物は事業開発・品質担当が確認
  - 顧客への送付は承認制
  stop_conditions:
  - 根拠不足の数値・主張が残る
  - 契約仕様との不一致
  - 上限超過
  - config/budgets.yaml の案件別上限（費用・実行時間・再試行回数。未設定のうちは本番稼働させない）
  forbidden:
  - データ・出典の捏造
  - 成果保証の表現
  evaluation:
  - 独立監査の合格率
  - 手戻り率
  - 納期遵守
  open_questions:
  - レポートの標準フォーマット・出力形式
  - 図表の作成は初期チームでは本役割が簡易対応（データ可視化 AI は後段階）
last_updated: '2026-11-02'
history:
- date: '2026-11-02'
  change: 初期チーム（STEP 4）向けの定義案を作成
