  change: 現役性の基準を明記（社長確認 案 A）
- date: '2026-11-07'
  change: 測定外の資源（参考候補）を採用可にしない旨を禁止事項に追加（社長指示）
- date: '2026-11-05'
  change: 観光資源の確認・追加フロー（D-053）の定義案を作成（資源の追加案の独立監査と、追加後の検証。試験稼働。台帳は変更しない）
