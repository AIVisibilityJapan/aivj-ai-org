# 役割定義。全体一覧の正本は 文書/設計/AI_ROLES.csv
# このファイルは複製せず更新する。変更は末尾の history に新しい順で追記する。
role_id: AI-03-05
role_name: レポート制作 AI
type: 係担当 AI
dept_code: D03
dept: AIV・調査分析部
section: レポート制作課
unit: レポート構成・執筆係
service_responsibility: null
max_risk_tier: low
human_checkpoint: 重要レポートは人間レビュー+経営管理部の独立監査
escalate_to: AI-D03
build_step: STEP4
pilot: true
impl_status: definition_drafted
definition:
  definition_status: 案（STEP 4 試験で検証済み。社長の承認待ち。台帳の impl_status は承認まで変えない）
  purpose: 整理済みの値と案件パラメータを、採用したひな形（FMT v2.24）に差し込み、無償診断レポート（2 枚）の草稿を別名の PPTX として作る。値は作らない。
  trigger:
  - AIO 診断の完了と引継ぎ
  inputs:
  - AI-03-01 の整理済みの値
  - 案件パラメータ（発行日・次回配信・測定期間）
  - 採用したひな形（FMT v2.24。pins.yaml で SHA を固定。読み取りのみ）
  outputs:
  - レポート草稿（PPTX。ひな形とは別名）と SHA
  - 品質・リスク監査 AI への監査依頼（成果物のファイルと SHA のみ）
  - 根拠データが承認待ち（activation_state）のときは、社長確認用の注記を付けて引き継ぐ（止めない）
  tools:
  - src/aiv/report_filler.py（外部通信なし）
  - 共通DB（deliverables）
  permissions:
  - 'read: FMT ひな形（読み取りのみ）'
  - 'write: deliverables（レポート草稿）'
  - '禁止: ひな形の上書き、顧客への送信（人間承認後に別手順）'
  handoff_from:
  - AIO 診断 AI
  - 地域 AIV 分析 AI
  handoff_to:
  - 品質・リスク監査 AI
  human_checkpoints:
  - 重要成果物は事業開発・品質担当が確認
  - 顧客への送付は承認制
  stop_conditions:
  - 対応表にない差し込み項目、または値が空の項目がある
  - 案件パラメータが未指定
  - ひな形を上書きしようとした
  - 設定/budgets.yaml の案件別上限（費用・実行時間・再試行回数。未設定のうちは本番稼働させない）
  - 採用したひな形の SHA が固定と違う（差戻し）
  - 値ファイルの SHA が pins.yaml の固定と違う、または整理済みの値の参照元の記録がない（差戻し。差し込みの前に原本から読み直して照合する）
  forbidden:
  - データ・出典の捏造
  - 成果保証の表現
  - 出現率 0% を「観光資源がない」と表現すること
  - 欠損（NO_FORMAL_ROW・NOT_APPLICABLE・NOT_AVAILABLE）を 0% と表示すること
  - APA 由来の資源が Top3 に表示されたことを「出現率が上がった」と表現すること
  - 正式 selector の出力以外で、独自スコアにより資源を選び直す・出現率と APA を独自に再結合すること
  - 差し込み項目以外の文面を書き換えること（ひな形の誤りは直さず、監査・社長に報告する）
  - 無い観光資源を空欄や 0 で埋めること（正式データの表示『―』をそのまま使う）
  evaluation:
  - 独立監査の合格率
  - 手戻り率
  - 納期遵守
  - 値の状態（EXPLICIT_ZERO・NO_FORMAL_ROW・NOT_APPLICABLE・NOT_AVAILABLE）が区別して表示されている
  - category_scope_rate と category_all_scopes_rate を混同していない
  - 完成済みの自治体で、完成品と本文が全図形一致する（T4-04）
  - 差し込み項目 {{…}} が残らない
  open_questions:
  - 有償レポート②③④の差し込み様式
