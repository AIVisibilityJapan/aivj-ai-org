# 2026-11-03（Q-04, Q-05）: 暫定値は設定しない。費用が発生する処理は都度社長が確認する。無償診断レポートは可能な限り API なしで進める。null は起動拒否のまま。
# 上限値は初期試験で現状を計測してから確定する（null = 未設定。未設定のまま本番稼働させない）
initial_3_months:
  target_total_jpy: {min: 100000, max: 150000}   # 資料の目標。保証ではない
  note: 人件費・外部技術者費用・有料データ取得費・税金は含まない
per_run_limits:
  max_cost_usd: null
  max_runtime_seconds: null
  max_retries: null
monthly_limits:
  claude_platform_usd: null
exchange_rate_note: 資料は 1 ドル約 157 円換算（2026-10-23 時点の目安）
# 2026-11-04（D-033）: 費用はドル建てで記録し、画面にはドルの横に円（目安）を併記する。為替は表示専用で、上限の判定には使わない。null の間は円を表示しない
display:
  usd_jpy: 157
  usd_jpy_as_of: "2026-10-23"

# STEP 2 詳細設計で追加。null = 未設定。未設定の役割・案件は起動しない（fail closed）
daily_limits:
  max_cost_usd: null
circuit_breaker:
  consecutive_failures_to_stop_role: null
approval:
  ttl_hours: null
human_queue:
  max_pending_high_risk: null
